<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad News</title>
    <style>
        body {
            background-color: #4a2838;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #d1b8c4;
        }
        .card {
            background-color: #f7ede2;
            width: 100%;
            max-width: 380px;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
            text-align: left;
        }
        h1 {
            color: #2b1722;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        p {
            color: #6b5360;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .back-btn {
            display: inline-block;
            background-color: #f3c68f;
            color: #4a2838;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Bad News 🌧️</h1>
        <p>There isn't none, just that you're stuck with me forever ;)</p>
        <a href="index.html" class="back-btn">&larr; Back</a>
    </div>

</body>
</html>
